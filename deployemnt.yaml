apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-app
  namespace: inventory
  labels:
    app: inventory-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: inventory-app

  template:
    metadata:
      labels:
        app: inventory-app

    spec:
      containers:
      - name: inventory-app
        image: srikantheggoju/inventory-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"

        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
